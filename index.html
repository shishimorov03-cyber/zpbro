<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Твоя зарплата</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Malovi DEMO';
    src: local('Malovi DEMO'), local('MaloviDEMO'), local('Malovi');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    color: #e0e6f0;
    font-family: 'Malovi DEMO', 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    padding: 20px 10px 60px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 30px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  .star {
    font-size: 36px;
    color: #4a9eff;
    animation: pulse 2s ease-in-out infinite;
    text-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
  }
  .star.right { animation-delay: 1s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  .header h1 {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(135deg, #4a9eff, #7ec8ff, #4a9eff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }

  /* Department tabs */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 24px auto 30px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 12px 36px;
    background: rgba(20, 30, 55, 0.8);
    border: 1px solid rgba(74, 158, 255, 0.25);
    border-radius: 14px;
    color: #8a9bb8;
    cursor: pointer;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    transition: all 0.3s ease;
  }
  .tab:hover {
    border-color: rgba(74, 158, 255, 0.5);
    color: #b0c4e0;
    background: rgba(30, 45, 80, 0.8);
  }
  .tab.active {
    background: linear-gradient(135deg, #1a3a6e, #2563a0);
    border-color: #4a9eff;
    color: #fff;
    box-shadow: 0 4px 24px rgba(74, 158, 255, 0.25);
  }

  /* Cards container */
  .cards-row {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: stretch;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding: 10px 20px 30px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Card */
  .card {
    flex: 1 1 0;
    min-width: 280px;
    max-width: 340px;
    background: linear-gradient(165deg, #121828 0%, #0f1626 100%);
    border: 1px solid rgba(74, 158, 255, 0.12);
    border-radius: 18px;
    padding: 24px 20px;
    transition: all 0.35s ease;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    border-color: rgba(74, 158, 255, 0.4);
    box-shadow: 0 8px 40px rgba(74, 158, 255, 0.12);
    background: linear-gradient(165deg, #141c30 0%, #111a30 100%);
    transform: translateY(-3px);
  }
  .card h3 {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #7ec8ff;
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(74, 158, 255, 0.15);
  }

  /* Sliders */
  .slider-group {
    margin-bottom: 18px;
  }
  .slider-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .slider-label span:first-child {
    font-size: 14px;
    font-weight: 600;
    color: #8a9bb8;
  }
  .slider-input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .slider-input-wrap input[type="number"] {
    width: 56px;
    padding: 4px 6px;
    background: rgba(15, 25, 50, 0.9);
    border: 1px solid rgba(74, 158, 255, 0.2);
    border-radius: 6px;
    color: #e0e6f0;
    font-family: inherit;
    font-size: 14px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .slider-input-wrap input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
  }
  .slider-input-wrap span {
    font-size: 14px;
    color: #5a6b88;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    background: linear-gradient(90deg, #1a3a6e, #2563a0);
    border-radius: 6px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    background: linear-gradient(135deg, #4a9eff, #7ec8ff);
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #0a0e1a;
    box-shadow: 0 2px 10px rgba(74, 158, 255, 0.4);
    transition: transform 0.2s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    background: linear-gradient(135deg, #4a9eff, #7ec8ff);
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #0a0e1a;
    box-shadow: 0 2px 10px rgba(74, 158, 255, 0.4);
  }
  .slider-value {
    font-size: 14px;
    font-weight: 700;
    color: #7ec8ff;
    min-width: 90px;
    text-align: right;
  }

  /* Results */
  .results {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid rgba(74, 158, 255, 0.12);
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .result-row .label { font-weight: 500; color: #8a9bb8; }
  .result-row .amount { font-weight: 700; font-size: 16px; }

  .r-total { background: rgba(74, 158, 255, 0.08); }
  .r-total .amount { color: #7ec8ff; }
  .r-total-nokzh { background: rgba(74, 158, 255, 0.06); }
  .r-total-nokzh .amount { color: #a0d4ff; }

  .r-advance { background: rgba(255, 165, 70, 0.1); border: 1px solid rgba(255, 165, 70, 0.2); }
  .r-advance .label { color: #e8a060; }
  .r-advance .amount { color: #ffb050; }

  .r-zp-kzh { background: rgba(100, 180, 255, 0.1); border: 1px solid rgba(100, 180, 255, 0.2); }
  .r-zp-kzh .label { color: #6ab4ff; }
  .r-zp-kzh .amount { color: #7ec8ff; }

  .r-zp-nokzh { background: rgba(80, 200, 120, 0.1); border: 1px solid rgba(80, 200, 120, 0.2); }
  .r-zp-nokzh .label { color: #5cc880; }
  .r-zp-nokzh .amount { color: #6ee890; }

  .no-data {
    text-align: center;
    color: #4a5a78;
    padding: 60px 20px;
    font-size: 16px;
  }

  /* Note */
  .note {
    max-width: 700px;
    margin: 40px auto 0;
    padding: 20px 30px;
    background: rgba(15, 22, 40, 0.6);
    border: 1px solid rgba(74, 158, 255, 0.1);
    border-radius: 14px;
    text-align: center;
    font-size: 14px;
    color: #6a7b98;
    line-height: 1.9;
  }
  .note b { color: #8a9bb8; }
</style>
</head>
<body>

<div class="header">
  <span class="star">★</span>
  <h1>Твоя зарплата</h1>
  <span class="star right">★</span>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchDept('stroyka')">Стройка</button>
  <button class="tab" onclick="switchDept('ideologiya')">Идеология</button>
  <button class="tab" onclick="switchDept('ekspluataciya')">Эксплуатация</button>
</div>

<div class="cards-row" id="cardsRow"></div>

<div class="note">
  <b>КЖ</b> — корпоративное жилье &nbsp;•&nbsp; <b>ЗП</b> — заработная плата &nbsp;•&nbsp; <b>MBO</b> — цели мирового уровня &nbsp;•&nbsp; <b>ДИ</b> — должностные инструкции
</div>

<script>
const data = {
  stroyka: {
    positions: [
      { name: 'Специалист', mbo: 41325, di: 82650, oklad: 41325, kzh: 9091.5 },
      { name: 'Ведущий специалист', mbo: 97850, di: 195750, oklad: 97850, kzh: 17617.5 },
      { name: 'Старший специалист', mbo: 54375, di: 108750, oklad: 54375, kzh: 35626.5 },
      { name: 'Главный специалист', mbo: 119625, di: 239250, oklad: 119625, kzh: 35887.5 }
    ]
  },
  ideologiya: {
    positions: [
      { name: 'Специалист', mbo: 80475, di: 160950, oklad: 80475, kzh: 8047.5 },
      { name: 'Ведущий специалист', mbo: 138124, di: 276248, oklad: 138124, kzh: 17956.12 },
      { name: 'Старший специалист', mbo: 0, di: 0, oklad: 0, kzh: 0 },
      { name: 'Главный специалист', mbo: 0, di: 0, oklad: 0, kzh: 0 }
    ]
  },
  ekspluataciya: {
    positions: [
      { name: 'Специалист', mbo: 0, di: 0, oklad: 0, kzh: 0 },
      { name: 'Ведущий специалист', mbo: 106250, di: 212500, oklad: 106250, kzh: 18062.5 },
      { name: 'Старший специалист', mbo: 0, di: 0, oklad: 0, kzh: 0 },
      { name: 'Главный специалист', mbo: 0, di: 0, oklad: 0, kzh: 0 }
    ]
  }
};

let currentDept = 'stroyka';
const state = {};

function initState() {
  for (const dept in data) {
    state[dept] = {};
    for (let i = 0; i < 4; i++) {
      state[dept][i] = { mbo: 100, di: 100, oklad: 100 };
    }
  }
}

function fmt(n) {
  if (!n || n === 0) return '0 ₽';
  return n.toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ₽';
}

function calc(pos, perc) {
  const mboR = pos.mbo * perc.mbo / 100;
  const diR = pos.di * perc.di / 100;
  const okladR = pos.oklad * perc.oklad / 100;
  const totalNoKzh = mboR + diR + okladR;
  const totalKzh = totalNoKzh - pos.kzh;
  const advance = okladR / 2;
  const zpKzh = totalKzh - advance;
  const zpNoKzh = totalNoKzh - advance;
  return { mboR, diR, okladR, totalKzh, totalNoKzh, advance, zpKzh, zpNoKzh };
}

function buildCard(idx, pos, dept) {
  if (pos.mbo === 0 && pos.di === 0 && pos.oklad === 0) {
    return `
      <div class="card">
        <h3>${pos.name}</h3>
        <div class="no-data">Нет данных</div>
      </div>`;
  }
  const p = state[dept][idx];
  const r = calc(pos, p);
  return `
    <div class="card" data-dept="${dept}" data-idx="${idx}">
      <h3>${pos.name}</h3>
      <div class="slider-group">
        <div class="slider-label">
          <span>MBO</span>
          <div class="slider-input-wrap">
            <input type="number" min="0" max="100" value="${p.mbo}" data-field="mbo" data-idx="${idx}" data-dept="${dept}">
            <span>%</span>
          </div>
        </div>
        <input type="range" min="0" max="100" value="${p.mbo}" step="1" data-field="mbo" data-idx="${idx}" data-dept="${dept}">
        <div class="slider-value">${fmt(r.mboR)}</div>
      </div>
      <div class="slider-group">
        <div class="slider-label">
          <span>ДИ</span>
          <div class="slider-input-wrap">
            <input type="number" min="0" max="100" value="${p.di}" data-field="di" data-idx="${idx}" data-dept="${dept}">
            <span>%</span>
          </div>
        </div>
        <input type="range" min="0" max="100" value="${p.di}" step="1" data-field="di" data-idx="${idx}" data-dept="${dept}">
        <div class="slider-value">${fmt(r.diR)}</div>
      </div>
      <div class="slider-group">
        <div class="slider-label">
          <span>Оклад</span>
          <div class="slider-input-wrap">
            <input type="number" min="0" max="100" value="${p.oklad}" data-field="oklad" data-idx="${idx}" data-dept="${dept}">
            <span>%</span>
          </div>
        </div>
        <input type="range" min="0" max="100" value="${p.oklad}" step="1" data-field="oklad" data-idx="${idx}" data-dept="${dept}">
        <div class="slider-value">${fmt(r.okladR)}</div>
      </div>
      <div class="results">
        <div class="result-row r-total">
          <span class="label">Итого с КЖ</span>
          <span class="amount">${fmt(r.totalKzh)}</span>
        </div>
        <div class="result-row r-total-nokzh">
          <span class="label">Итого без КЖ</span>
          <span class="amount">${fmt(r.totalNoKzh)}</span>
        </div>
        <div class="result-row r-advance">
          <span class="label">Аванс 25 числа</span>
          <span class="amount">${fmt(r.advance)}</span>
        </div>
        <div class="result-row r-zp-kzh">
          <span class="label">ЗП 10 числа с КЖ</span>
          <span class="amount">${fmt(r.zpKzh)}</span>
        </div>
        <div class="result-row r-zp-nokzh">
          <span class="label">ЗП 10 числа без КЖ</span>
          <span class="amount">${fmt(r.zpNoKzh)}</span>
        </div>
      </div>
    </div>`;
}

function renderDept() {
  const container = document.getElementById('cardsRow');
  const dept = data[currentDept];
  let html = '';
  for (let i = 0; i < 4; i++) {
    html += buildCard(i, dept.positions[i], currentDept);
  }
  container.innerHTML = html;
  attachListeners();
}

function updateCard(idx, dept) {
  const pos = data[dept].positions[idx];
  if (pos.mbo === 0 && pos.di === 0 && pos.oklad === 0) return;
  const p = state[dept][idx];
  const r = calc(pos, p);
  const card = document.querySelector(`.card[data-dept="${dept}"][data-idx="${idx}"]`);
  if (!card) return;
  const vals = card.querySelectorAll('.slider-value');
  vals[0].textContent = fmt(r.mboR);
  vals[1].textContent = fmt(r.diR);
  vals[2].textContent = fmt(r.okladR);
  const amounts = card.querySelectorAll('.result-row .amount');
  amounts[0].textContent = fmt(r.totalKzh);
  amounts[1].textContent = fmt(r.totalNoKzh);
  amounts[2].textContent = fmt(r.advance);
  amounts[3].textContent = fmt(r.zpKzh);
  amounts[4].textContent = fmt(r.zpNoKzh);
}

function attachListeners() {
  document.querySelectorAll('input[type="range"], input[type="number"]').forEach(el => {
    el.addEventListener('input', e => {
      const field = e.target.dataset.field;
      const idx = parseInt(e.target.dataset.idx);
      const dept = e.target.dataset.dept;
      let val = parseInt(e.target.value);
      if (isNaN(val)) val = 0;
      val = Math.max(0, Math.min(100, val));
      state[dept][idx][field] = val;
      // Sync the pair
      const card = e.target.closest('.card');
      if (card) {
        const range = card.querySelector(`input[type="range"][data-field="${field}"]`);
        const num = card.querySelector(`input[type="number"][data-field="${field}"]`);
        if (e.target.type === 'range' && num) num.value = val;
        if (e.target.type === 'number' && range) range.value = val;
      }
      updateCard(idx, dept);
    });
  });
}

function switchDept(dept) {
  currentDept = dept;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderDept();
}

initState();
renderDept();
</script>
</body>
</html>
